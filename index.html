<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOT Student Portal - MindSpark Online Tutorial</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: {
                            800: '#0f2042',
                            900: '#1e3a8a',
                            700: '#1e293b'
                        },
                        amber: {
                            500: '#f59e0b',
                            600: '#d97706',
                            400: '#fbbf24'
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- Notification Toast Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- MODAL CONTAINER FOR EDITING -->
    <div id="modal-container" class="fixed inset-0 z-50 bg-slate-950/60 flex items-center justify-center p-4 hidden">
        <div id="modal-content-box" class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
            <!-- Dynamically populated edit modal body -->
        </div>
    </div>

    <!-- FLOATING CALCULATOR WIDGET (MANUAL TOGGLE ONLY) -->
    <div id="calculator-widget" class="fixed bottom-5 right-5 z-50 hidden shadow-2xl rounded-2xl overflow-hidden border-2 border-slate-700 bg-slate-900 w-72 text-white transition-all">
        <div class="bg-navy-800 px-4 py-2.5 flex justify-between items-center cursor-move border-b border-slate-700">
            <span class="text-xs font-bold text-amber-400 flex items-center gap-1.5">
                <i class="fas fa-calculator"></i> Exam Calculator
            </span>
            <button onclick="window.toggleCalculator(false)" class="text-slate-400 hover:text-white text-xs p-1">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="p-3 space-y-3">
            <input type="text" id="calc-display" readonly value="0" class="w-full bg-slate-950 text-right px-3 py-2 rounded-xl text-xl font-mono text-emerald-400 font-bold border border-slate-800 outline-none">
            <div class="grid grid-cols-4 gap-1.5 text-xs font-bold">
                <button onclick="window.calcClear()" class="bg-red-600/80 hover:bg-red-600 p-2.5 rounded-lg text-white">C</button>
                <button onclick="window.calcSqrt()" class="bg-slate-700 hover:bg-slate-600 p-2.5 rounded-lg text-amber-400">√</button>
                <button onclick="window.calcBackspace()" class="bg-slate-700 hover:bg-slate-600 p-2.5 rounded-lg text-slate-300"><i class="fas fa-backspace"></i></button>
                <button onclick="window.calcOp('/')" class="bg-amber-500 hover:bg-amber-600 p-2.5 rounded-lg text-slate-950">÷</button>

                <button onclick="window.calcNum('7')" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-lg">7</button>
                <button onclick="window.calcNum('8')" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-lg">8</button>
                <button onclick="window.calcNum('9')" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-lg">9</button>
                <button onclick="window.calcOp('*')" class="bg-amber-500 hover:bg-amber-600 p-2.5 rounded-lg text-slate-950">×</button>

                <button onclick="window.calcNum('4')" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-lg">4</button>
                <button onclick="window.calcNum('5')" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-lg">5</button>
                <button onclick="window.calcNum('6')" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-lg">6</button>
                <button onclick="window.calcOp('-')" class="bg-amber-500 hover:bg-amber-600 p-2.5 rounded-lg text-slate-950">-</button>

                <button onclick="window.calcNum('1')" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-lg">1</button>
                <button onclick="window.calcNum('2')" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-lg">2</button>
                <button onclick="window.calcNum('3')" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-lg">3</button>
                <button onclick="window.calcOp('+')" class="bg-amber-500 hover:bg-amber-600 p-2.5 rounded-lg text-slate-950">+</button>

                <button onclick="window.calcNum('0')" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-lg col-span-2">0</button>
                <button onclick="window.calcNum('.')" class="bg-slate-800 hover:bg-slate-700 p-2.5 rounded-lg">.</button>
                <button onclick="window.calcEqual()" class="bg-emerald-600 hover:bg-emerald-500 p-2.5 rounded-lg text-white">=</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app" class="flex-grow flex flex-col min-h-screen">
        <!-- HEADER / NAVIGATION BAR -->
        <header class="bg-navy-800 text-white shadow-md sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-3 cursor-pointer" onclick="window.appState.currentUser ? window.navigateTo('dashboard') : null">
                    <img src="https://i.postimg.cc/vDj6h2rf/MOT.png" alt="MOT Logo" class="h-10 w-auto object-contain bg-white/10 rounded p-1" onerror="this.onerror=null; this.src='https://placehold.co/100x100/0f2042/ffffff?text=MOT';">
                    <div>
                        <span class="text-lg font-extrabold tracking-wide text-white block leading-none">MOT PORTAL</span>
                        <span class="text-[10px] text-amber-400 font-medium tracking-widest uppercase block mt-0.5">MindSpark Online Tutorial</span>
                    </div>
                </div>

                <div id="nav-user-controls" class="flex items-center gap-3">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </header>

        <!-- MAIN CONTENT AREA -->
        <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div id="view-container"></div>
        </main>

        <!-- FOOTER -->
        <footer class="bg-slate-900 text-slate-400 text-sm py-6 border-t border-slate-800 mt-auto">
            <div class="max-w-7xl mx-auto px-4 text-center flex flex-col md:flex-row justify-between items-center gap-2">
                <div class="flex items-center space-x-2">
                    <span class="font-bold text-white">MindSpark Online Tutorial (MOT)</span>
                    <span>&bull; UTME/JAMB Excellence System</span>
                </div>
                <p>&copy; 2026 MOT Academic System. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <!-- FIREBASE & MAIN MODULE SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-analytics.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCvQnkPVEEY_OTnqyPJtS4skwJExkrTwA4",
            authDomain: "mindsparkonline-ab500.firebaseapp.com",
            projectId: "mindsparkonline-ab500",
            storageBucket: "mindsparkonline-ab500.firebasestorage.app",
            messagingSenderId: "798632520292",
            appId: "1:798632520292:web:0e7110f1372acc97d60d71",
            measurementId: "G-62728KLQJX"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        // Application Data Object synced with Firestore collections
        let appData = {
            accessCodes: [],
            questions: [],
            flashcards: [],
            mockExams: [],
            studentAttempts: []
        };

        // Realtime Firestore Listeners
        const collectionsList = ['accessCodes', 'questions', 'flashcards', 'mockExams', 'studentAttempts'];
        collectionsList.forEach(colName => {
            onSnapshot(collection(db, colName), (snapshot) => {
                const items = [];
                snapshot.forEach(docSnap => {
                    items.push({ id: docSnap.id, ...docSnap.data() });
                });
                appData[colName] = items;
                console.log(`Firestore Synced [${colName}]:`, items.length);
                if (window.renderApp) window.renderApp();
            }, (error) => {
                console.error(`Firestore Error on ${colName}:`, error);
            });
        });

        // Helper function to save/update an item in Firestore
        window.saveFirestoreDoc = async function(colName, id, data) {
            try {
                await setDoc(doc(db, colName, id), data);
                console.log(`Saved to Firestore [${colName}/${id}]`);
            } catch (err) {
                console.error("Firestore write error:", err);
                window.showToast("Cloud sync warning: Check Firestore rules.", "warning");
            }
        };

        // Helper function to delete an item in Firestore
        window.deleteFirestoreDoc = async function(colName, id) {
            try {
                await deleteDoc(doc(db, colName, id));
                console.log(`Deleted from Firestore [${colName}/${id}]`);
            } catch (err) {
                console.error("Firestore delete error:", err);
            }
        };

        let appState = {
            currentUser: JSON.parse(localStorage.getItem('mot_user_session')) || null,
            currentView: 'login',
            activeTab: 'mocks',
            activeQuiz: null,
            activeExamSubjectFilter: 'ALL',
            quizTimer: null,
            practiceSelections: {
                subjects: [],
                subjectTopics: {},
                timerMins: 20
            }
        };

        window.appState = appState;

        // =========================================================================
        // CALCULATOR ENGINE
        // =========================================================================
        let calcVal = "0";
        let calcNewNum = true;

        window.toggleCalculator = function(show) {
            const calc = document.getElementById('calculator-widget');
            if (!calc) return;
            if (show === undefined) {
                calc.classList.toggle('hidden');
            } else if (show) {
                calc.classList.remove('hidden');
            } else {
                calc.classList.add('hidden');
            }
        };

        window.calcNum = function(num) {
            const display = document.getElementById('calc-display');
            if (calcVal === "0" || calcNewNum) {
                calcVal = num;
                calcNewNum = false;
            } else {
                calcVal += num;
            }
            display.value = calcVal;
        };

        window.calcOp = function(op) {
            calcVal += ' ' + op + ' ';
            calcNewNum = false;
            document.getElementById('calc-display').value = calcVal;
        };

        window.calcClear = function() {
            calcVal = "0";
            calcNewNum = true;
            document.getElementById('calc-display').value = calcVal;
        };

        window.calcBackspace = function() {
            if (calcVal.length > 1) {
                calcVal = calcVal.trim().slice(0, -1).trim();
                if (calcVal === "") calcVal = "0";
            } else {
                calcVal = "0";
            }
            document.getElementById('calc-display').value = calcVal;
        };

        window.calcSqrt = function() {
            try {
                const evalVal = eval(calcVal.replace(/×/g, '*').replace(/÷/g, '/'));
                if (evalVal < 0) {
                    document.getElementById('calc-display').value = "Error";
                    calcVal = "0";
                    calcNewNum = true;
                    return;
                }
                const res = Math.sqrt(evalVal);
                calcVal = res.toString();
                document.getElementById('calc-display').value = calcVal;
                calcNewNum = true;
            } catch(e) {
                document.getElementById('calc-display').value = "Error";
                calcVal = "0";
                calcNewNum = true;
            }
        };

        window.calcEqual = function() {
            try {
                const sanitized = calcVal.replace(/×/g, '*').replace(/÷/g, '/');
                const res = eval(sanitized);
                calcVal = Number.isInteger(res) ? res.toString() : res.toFixed(4).toString();
                document.getElementById('calc-display').value = calcVal;
                calcNewNum = true;
            } catch(e) {
                document.getElementById('calc-display').value = "Error";
                calcVal = "0";
                calcNewNum = true;
            }
        };

        // =========================================================================
        // NOTIFICATION TOAST SYSTEM
        // =========================================================================
        window.showToast = function(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const bgClass = type === 'success' ? 'bg-emerald-600' :
                            type === 'error' ? 'bg-red-600' :
                            type === 'warning' ? 'bg-amber-600' : 'bg-navy-800';
            
            toast.className = `${bgClass} text-white px-4 py-3 rounded-xl shadow-xl text-xs sm:text-sm font-semibold transition-all transform translate-y-2 opacity-0 flex items-center gap-2 pointer-events-auto max-w-md`;
            let icon = type === 'success' ? 'fa-check-circle' : type === 'error' ? 'fa-exclamation-triangle' : 'fa-info-circle';

            toast.innerHTML = `<i class="fas ${icon}"></i> <span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        };

        // =========================================================================
        // ROUTING & APP STATE
        // =========================================================================
        window.navigateTo = function(view, tab = null) {
            appState.currentView = view;
            if (tab) appState.activeTab = tab;
            if (view !== 'exam-session') window.toggleCalculator(false);
            window.renderApp();
        };

        window.renderApp = function() {
            renderHeaderControls();
            const container = document.getElementById('view-container');
            if (!container) return;
            container.innerHTML = '';

            if (!appState.currentUser && appState.currentView !== 'login') {
                appState.currentView = 'login';
            }

            switch(appState.currentView) {
                case 'login': renderLoginView(container); break;
                case 'admin':
                    if (appState.currentUser?.role !== 'admin') {
                        window.showToast('Access denied', 'error');
                        appState.currentView = 'dashboard';
                        window.renderApp();
                        return;
                    }
                    renderAdminDashboard(container);
                    break;
                case 'dashboard': renderStudentDashboard(container); break;
                case 'exam-session': renderExamSessionView(container); break;
                default: renderLoginView(container);
            }
        };

        function renderHeaderControls() {
            const container = document.getElementById('nav-user-controls');
            if (!container) return;
            if (!appState.currentUser) {
                container.innerHTML = `
                    <button onclick="window.navigateTo('login')" class="text-xs bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-3 py-1.5 rounded-lg transition">
                        <i class="fas fa-sign-in-alt mr-1"></i> Sign In
                    </button>
                `;
                return;
            }

            const isStudent = appState.currentUser.role === 'student';
            container.innerHTML = `
                <div class="flex items-center gap-3">
                    <div class="text-right hidden sm:block">
                        <div class="text-[10px] text-slate-300">Logged in as</div>
                        <div class="text-xs font-bold text-amber-400">
                            ${appState.currentUser.name} 
                            <span class="text-[9px] bg-slate-800 text-white px-1.5 py-0.5 rounded border border-slate-700 ml-1">
                                ${isStudent ? appState.currentUser.code : 'ADMIN'}
                            </span>
                        </div>
                    </div>

                    ${!isStudent ? `
                        <button onclick="window.navigateTo('admin')" class="text-xs bg-amber-500 hover:bg-amber-400 text-navy-800 font-bold px-3 py-1.5 rounded-lg transition shadow">
                            <i class="fas fa-user-shield mr-1"></i> Admin Panel
                        </button>
                    ` : ''}

                    ${isStudent && appState.currentView !== 'dashboard' ? `
                        <button onclick="window.navigateTo('dashboard')" class="text-xs bg-slate-700 hover:bg-slate-600 text-white font-medium px-3 py-1.5 rounded-lg transition">
                            <i class="fas fa-home mr-1"></i> Dashboard
                        </button>
                    ` : ''}

                    <button onclick="window.logout()" class="text-xs bg-red-600/80 hover:bg-red-600 text-white font-medium px-2.5 py-1.5 rounded-lg transition">
                        <i class="fas fa-power-off"></i>
                    </button>
                </div>
            `;
        }

        window.logout = function() {
            if (appState.quizTimer) clearInterval(appState.quizTimer);
            appState.currentUser = null;
            appState.activeQuiz = null;
            localStorage.removeItem('mot_user_session');
            window.toggleCalculator(false);
            window.showToast('Logged out successfully', 'info');
            window.navigateTo('login');
        };

        // =========================================================================
        // AUTHENTICATION
        // =========================================================================
        function renderLoginView(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto my-8 bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-200">
                    <div class="bg-navy-800 p-6 text-center text-white relative">
                        <img src="https://i.postimg.cc/vDj6h2rf/MOT.png" alt="MOT Logo" class="h-16 mx-auto mb-2 bg-white/10 rounded-lg p-1.5 object-contain" onerror="this.onerror=null; this.src='https://placehold.co/120x120/0f2042/ffffff?text=MOT';">
                        <h2 class="text-xl font-bold">MindSpark Online Tutorial</h2>
                        <p class="text-xs text-amber-400 mt-1 uppercase font-semibold tracking-wider">MOT Student Portal</p>
                    </div>

                    <div class="flex border-b border-slate-200 bg-slate-50 text-sm font-semibold">
                        <button id="tab-btn-student" onclick="window.toggleAuthTab('student')" class="flex-1 py-3 text-navy-800 border-b-2 border-amber-500 bg-white">
                            <i class="fas fa-user-graduate mr-1"></i> Student Login
                        </button>
                        <button id="tab-btn-admin" onclick="window.toggleAuthTab('admin')" class="flex-1 py-3 text-slate-500 hover:text-navy-800 border-b-2 border-transparent">
                            <i class="fas fa-user-shield mr-1"></i> Admin Login
                        </button>
                    </div>

                    <div id="form-student-login" class="p-6 space-y-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Student Access Code</label>
                            <input type="text" id="student-code-input" placeholder="Enter your code" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-amber-500 text-lg font-mono font-bold uppercase tracking-wider text-navy-800 bg-slate-50">
                        </div>
                        <button onclick="window.handleStudentLogin()" class="w-full bg-navy-800 hover:bg-navy-900 text-amber-400 font-bold py-3.5 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                            <span>Access MOT Portal</span>
                            <i class="fas fa-arrow-right"></i>
                        </button>
                        <div class="mt-4 pt-4 border-t border-slate-100 text-xs text-slate-500 text-center">
                            Click <div style="color:blue;"> <a href="https://wa.me/2348058382531"> ADMIN</a> </div>to ask for your unique student access code. 
                        </div>
                    </div>

                    <div id="form-admin-login" class="p-6 space-y-4 hidden">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Admin Passcode</label>
                            <input type="password" id="admin-pass-input" placeholder="Enter Admin Passcode" class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-amber-500 text-lg font-mono text-navy-800 bg-slate-50">
                            <p class="text-xs text-slate-500 mt-2">Passcode for <code class="bg-slate-200 px-1 py-0.5 rounded font-bold">ADMIN ONLY</code></p>
                        </div>
                        <button onclick="window.handleAdminLogin()" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3.5 px-4 rounded-xl shadow-lg transition flex items-center justify-center gap-2">
                            <span>Admin Portal Access</span>
                            <i class="fas fa-shield-alt"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        window.toggleAuthTab = function(tab) {
            const studentBtn = document.getElementById('tab-btn-student');
            const adminBtn = document.getElementById('tab-btn-admin');
            const studentForm = document.getElementById('form-student-login');
            const adminForm = document.getElementById('form-admin-login');

            if (tab === 'student') {
                studentBtn.className = "flex-1 py-3 text-navy-800 border-b-2 border-amber-500 bg-white font-bold";
                adminBtn.className = "flex-1 py-3 text-slate-500 hover:text-navy-800 border-b-2 border-transparent";
                studentForm.classList.remove('hidden');
                adminForm.classList.add('hidden');
            } else {
                adminBtn.className = "flex-1 py-3 text-navy-800 border-b-2 border-amber-500 bg-white font-bold";
                studentBtn.className = "flex-1 py-3 text-slate-500 hover:text-navy-800 border-b-2 border-transparent";
                adminForm.classList.remove('hidden');
                studentForm.classList.add('hidden');
            }
        };

        window.handleStudentLogin = function() {
            const codeInput = document.getElementById('student-code-input').value.trim().toUpperCase();
            if (!codeInput) return window.showToast('Please enter an access code', 'warning');

            const match = appData.accessCodes.find(c => c.code.toUpperCase() === codeInput);
            if (match) {
                appState.currentUser = { role: 'student', code: match.code, name: match.studentName };
                localStorage.setItem('mot_user_session', JSON.stringify(appState.currentUser));
                window.showToast(`Welcome back, ${match.studentName}!`, 'success');
                window.navigateTo('dashboard', 'mocks');
            } else {
                window.showToast('Invalid access code. Contact MOT Admin.', 'error');
            }
        };

        window.handleAdminLogin = function() {
            if (document.getElementById('admin-pass-input').value === 'ADMIN123') {
                appState.currentUser = { role: 'admin', code: 'ADMIN', name: 'MOT Administrator' };
                localStorage.setItem('mot_user_session', JSON.stringify(appState.currentUser));
                window.showToast('Logged in as Administrator', 'success');
                window.navigateTo('admin');
            } else {
                window.showToast('Invalid admin password', 'error');
            }
        };

        // =========================================================================
        // STUDENT PORTAL DASHBOARD
        // =========================================================================
        function renderStudentDashboard(container) {
            const user = appState.currentUser;
            container.innerHTML = `
                <div class="bg-gradient-to-r from-navy-800 via-navy-900 to-slate-900 text-white rounded-2xl p-6 mb-6 shadow-xl relative">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <div class="inline-flex items-center gap-2 bg-amber-500/20 text-amber-400 border border-amber-500/30 text-xs px-3 py-1 rounded-full font-bold uppercase mb-2">
                                <i class="fas fa-id-badge"></i> Code: ${user.code}
                            </div>
                            <h1 class="text-2xl sm:text-3xl font-extrabold">Welcome, ${user.name}!</h1>
                            <p class="text-slate-300 text-xs sm:text-sm mt-1">Custom multi-subject practice and exam drills with real-time scoring.</p>

        // --- CUSTOM PRACTICE ---

        window.toggleSubjectSelection = function(sub) {
            const idx = appState.practiceSelections.subjects.indexOf(sub);
            if (idx > -1) {
                if (appState.practiceSelections.subjects.length === 1) {
                    window.showToast('Select at least one subject for practice.', 'warning');
                    return;
                }
                appState.practiceSelections.subjects.splice(idx, 1);
                delete appState.practiceSelections.subjectTopics[sub];
            } else {
                appState.practiceSelections.subjects.push(sub);
                appState.practiceSelections.subjectTopics[sub] = { topic: 'ALL', limit: 'ALL' };
            }

            renderPracticeTab(document.getElementById('student-tab-content'));
        };

        function renderSubjectTopicConfigs() {
            const container = document.getElementById('topics-per-subject-container');
            if (!container) return;

            container.innerHTML = appState.practiceSelections.subjects.map(sub => {
                const subTopics = [...new Set(appData.questions.filter(q => q.subject.toLowerCase() === sub.toLowerCase()).map(q => q.topic))];
                const config = appState.practiceSelections.subjectTopics[sub] || { topic: 'ALL', limit: 'ALL' };

                return `
                    <div class="bg-white p-3.5 rounded-xl border border-slate-200 flex flex-col md:flex-row md:items-center justify-between gap-3">
                        <span class="text-xs font-bold text-navy-800 flex items-center gap-1.5 md:w-1/3">
                            <i class="fas fa-book text-amber-500"></i> ${sub}
                        </span>
                        
                        <div class="flex flex-col sm:flex-row items-center gap-2 md:w-2/3">
                            <select onchange="window.updateSubjectTopicChoice('${sub}', 'topic', this.value)" class="w-full sm:w-1/2 px-3 py-2 rounded-lg border border-slate-300 text-xs font-medium text-slate-800 bg-slate-50">
                                <option value="ALL" ${config.topic === 'ALL' ? 'selected' : ''}>All Topics (${subTopics.length})</option>
                                ${subTopics.map(t => `<option value="${t}" ${config.topic === t ? 'selected' : ''}>${t}</option>`).join('')}
                            </select>

                            <select onchange="window.updateSubjectTopicChoice('${sub}', 'limit', this.value)" class="w-full sm:w-1/2 px-3 py-2 rounded-lg border border-slate-300 text-xs font-semibold text-slate-800 bg-slate-50">
                                <option value="ALL" ${config.limit === 'ALL' ? 'selected' : ''}>All Available Questions</option>
                                <option value="10" ${config.limit === '10' ? 'selected' : ''}>Max 10 Questions</option>
                                <option value="20" ${config.limit === '20' ? 'selected' : ''}>Max 20 Questions</option>
                                <option value="40" ${config.limit === '40' ? 'selected' : ''}>Max 40 Questions</option>
                            </select>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.updateSubjectTopicChoice = function(subject, key, value) {
            if (!appState.practiceSelections.subjectTopics[subject]) {
                appState.practiceSelections.subjectTopics[subject] = { topic: 'ALL', limit: 'ALL' };
            }
            appState.practiceSelections.subjectTopics[subject][key] = value;
        };

        window.handleStartCustomPractice = function(e) {
            e.preventDefault();
            const timerMins = parseInt(document.getElementById('prac-timer').value);
            let compiledPool = [];

            appState.practiceSelections.subjects.forEach(sub => {
                const config = appState.practiceSelections.subjectTopics[sub] || { topic: 'ALL', limit: 'ALL' };
                let subQuestions = appData.questions.filter(q => q.subject.toLowerCase() === sub.toLowerCase());
                
                if (config.topic && config.topic !== 'ALL') {
                    subQuestions = subQuestions.filter(q => q.topic.toLowerCase() === config.topic.toLowerCase());
                }

                subQuestions = subQuestions.sort(() => 0.5 - Math.random());

                if (config.limit && config.limit !== 'ALL') {
                    subQuestions = subQuestions.slice(0, parseInt(config.limit));
                }

                compiledPool.push(...subQuestions);
            });

            if (compiledPool.length === 0) {
                window.showToast('No questions found for the selected configurations.', 'warning');
                return;
            }

            appState.activeQuiz = {
                title: `Custom Practice (${appState.practiceSelections.subjects.join(', ')})`,
                subject: appState.practiceSelections.subjects.join(', '),
                isMock: false,
                questions: compiledPool,
                durationMins: timerMins,
                answers: {},
                startTime: Date.now()
            };

            appState.activeExamSubjectFilter = 'ALL';
            window.navigateTo('exam-session');
        };

        // --- QUESTION VAULT ---
        function renderVaultTab(container) {
            container.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                        <h3 class="text-base font-extrabold text-navy-800 mb-2 flex items-center gap-2">
                            <i class="fas fa-database text-amber-500"></i> Search All Questions

                            <i class="fas fa-search absolute left-4 top-3 text-slate-400"></i>
                            <input type="text" id="vault-search-input" onkeyup="window.filterVaultQuestions()" placeholder="Search topic or question text..." class="w-full pl-11 pr-4 py-2.5 rounded-xl border border-slate-300 font-medium text-xs sm:text-sm text-slate-800 bg-slate-50">
                        </div>
                    </div>
                    <div id="vault-results-container" class="space-y-4"></div>
                </div>
            `;
            window.filterVaultQuestions();
        }

        window.filterVaultQuestions = function() {
            const input = document.getElementById('vault-search-input');
            const query = input ? input.value.toLowerCase().trim() : '';
            const container = document.getElementById('vault-results-container');
            if (!container) return;

            let filtered = appData.questions;
            if (query) {
                filtered = appData.questions.filter(q => 
                    q.topic.toLowerCase().includes(query) || 
                    q.subject.toLowerCase().includes(query) ||
                    q.question.toLowerCase().includes(query)
                );
            }

            if (filtered.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center border border-slate-200 text-slate-500 text-xs">No questions found in the question bank.</div>`;
                return;
            }

            container.innerHTML = filtered.map((q, idx) => `
                <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                    <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-2">
                        <span class="text-[10px] font-extrabold uppercase bg-navy-800 text-amber-400 px-2 py-0.5 rounded">${q.subject} - ${q.topic}</span>
                        <span class="text-xs text-slate-400 font-mono">Q#${idx + 1}</span>
                    </div>
                    <div class="text-xs sm:text-sm font-bold text-slate-800">${q.question}</div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        ${q.options.map((opt, oIdx) => `
                            <div class="text-xs p-2 rounded-lg border ${oIdx === q.correctAnswer ? 'bg-emerald-50 border-emerald-300 text-emerald-900 font-bold' : 'bg-slate-50 border-slate-200'}">
                                ${String.fromCharCode(65 + oIdx)}. ${opt}${oIdx === q.correctAnswer ? '✓' : ''}
                            </div>
                        `).join('')}
                    </div>
                    ${q.explanation ? `<div class="bg-amber-50/70 p-2.5 rounded-xl border border-amber-200 text-xs text-amber-950"><strong>Explanation:</strong> ${q.explanation}</div>` : ''}
                </div>
            `).join('');
        };

        // =========================================================================
        // ACTIVE EXAM / PRACTICE SESSION ENGINE
        // =========================================================================
        window.startMockExam = function(mockId) {
            const mock = appData.mockExams.find(m => m.id === mockId);
            if (!mock) return;

            const questions = (mock.questions || []).map(qId => appData.questions.find(q => q.id === qId)).filter(Boolean);
            if (questions.length === 0) return window.showToast('Mock exam has no questions.', 'warning');

            appState.activeQuiz = {
                mockId: mock.id,
                title: mock.title,
                subject: mock.subject,
                isMock: true,
                questions: questions,
                durationMins: mock.durationMins,
                answers: {},
                startTime: Date.now()
            };

            appState.activeExamSubjectFilter = 'ALL';
            window.navigateTo('exam-session');
        };

        function renderExamSessionView(container) {
            const quiz = appState.activeQuiz;
            if (!quiz) { window.navigateTo('dashboard'); return; }

            const examSubjects = [...new Set(quiz.questions.map(q => q.subject))];
            if (!appState.activeExamSubjectFilter) appState.activeExamSubjectFilter = 'ALL';

            let visibleQuestions = quiz.questions;
            if (appState.activeExamSubjectFilter !== 'ALL') {
                visibleQuestions = quiz.questions.filter(q => q.subject === appState.activeExamSubjectFilter);
            }

            const currentSubIdx = examSubjects.indexOf(appState.activeExamSubjectFilter);
            const nextSubjectName = (currentSubIdx !== -1 && currentSubIdx + 1 < examSubjects.length) ? examSubjects[currentSubIdx + 1] : null;

            container.innerHTML = `
                <div class="max-w-4xl mx-auto space-y-5">
                    <div class="bg-navy-800 text-white p-4 rounded-2xl shadow-lg flex flex-wrap justify-between items-center gap-4 sticky top-16 z-30 border border-slate-700">
                        <div>
                            <span class="text-[10px] uppercase font-bold text-amber-400 tracking-wider block">
                                ${quiz.isMock ? 'OFFICIAL STANDALONE MOCK EXAM' : 'CUSTOM PRACTICE SESSION'}
                            </span>
                            <h2 class="text-base sm:text-lg font-bold text-white">${quiz.title}</h2>
                        </div>

                        <div class="flex items-center gap-3">
                            <button onclick="window.toggleCalculator()" class="bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold px-3 py-2 rounded-xl text-xs transition flex items-center gap-1.5 shadow">
                                <i class="fas fa-calculator"></i> Calculator

        function startQuizTimer() {
            if (appState.quizTimer) clearInterval(appState.quizTimer);
            const quiz = appState.activeQuiz;
            if (!quiz || quiz.durationMins <= 0) return;

            const totalDurationSecs = quiz.durationMins * 60;

            appState.quizTimer = setInterval(() => {
                const elapsedSecs = Math.floor((Date.now() - quiz.startTime) / 1000);
                const remainingSecs = totalDurationSecs - elapsedSecs;

                const timerDisplay = document.getElementById('quiz-timer-display');
                if (timerDisplay) {
                    if (remainingSecs >= 0) {
                        const mins = Math.floor(remainingSecs / 60);
                        const secs = remainingSecs % 60;
                        timerDisplay.innerText = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                    }
                }

                if (remainingSecs <= 0) {
                    clearInterval(appState.quizTimer);
                    window.showToast('Time expired! Submitting exam.', 'warning');
                    processQuizSubmission();
                }
            }, 1000);
        }

        window.selectAnswer = function(questionId, optionIndex, btnElem) {
            if (!appState.activeQuiz) return;
            appState.activeQuiz.answers[questionId] = optionIndex;

            const parentGroup = document.getElementById(`options-group-${questionId}`);
            if (!parentGroup) return;

            const allBtns = parentGroup.querySelectorAll(`.option-btn-${questionId}`);
            allBtns.forEach((btn, idx) => {
                const badge = btn.querySelector('span');
                if (idx === optionIndex) {
                    btn.className = `option-btn-${questionId} w-full text-left p-3 rounded-xl border transition flex items-start gap-3 bg-amber-500 text-slate-950 font-bold border-amber-600 shadow`;
                    if (badge) badge.className = "w-6 h-6 rounded-full bg-slate-950 text-amber-400 text-xs font-bold flex items-center justify-center shrink-0";
                } else {
                    btn.className = `option-btn-${questionId} w-full text-left p-3 rounded-xl border transition flex items-start gap-3 bg-slate-50 hover:bg-slate-100 border-slate-200 text-slate-800 font-medium`;
                    if (badge) badge.className = "w-6 h-6 rounded-full bg-slate-200 text-slate-700 text-xs font-bold flex items-center justify-center shrink-0";
                }
            });
        };

        window.confirmSubmitQuiz = function() {
            if (confirm("Submit your responses now?")) {
                processQuizSubmission();
            }
        };

        function processQuizSubmission() {
            if (appState.quizTimer) clearInterval(appState.quizTimer);
            const quiz = appState.activeQuiz;
            if (!quiz) return;

            let correctCount = 0;
            quiz.questions.forEach(q => {
                if (quiz.answers[q.id] === q.correctAnswer) correctCount++;
            });

            const total = quiz.questions.length;
            const percentage = total > 0 ? (correctCount / total) * 100 : 0;

            if (quiz.isMock && appState.currentUser) {
                const attemptId = 'att_' + Date.now();
                const attemptData = {
                    studentCode: appState.currentUser.code,
                    studentName: appState.currentUser.name,
                    mockExamId: quiz.mockId,
                    mockTitle: quiz.title,
                    score: percentage,
                    correctCount: correctCount,
                    totalQuestions: total,
                    dateCompleted: new Date().toISOString().split('T')[0]
                };
                window.saveFirestoreDoc('studentAttempts', attemptId, attemptData);
                window.showToast(`Mock Submitted! Score: ${percentage.toFixed(1)}%`, 'success');
                appState.activeQuiz = null;
                window.navigateTo('dashboard', 'mocks');
            } else {
                renderPracticeResultReport(quiz, correctCount, total, percentage);
            }
        }

        window.handleMockUploadSingle = function(e, mockId) {
            e.preventDefault();
            const mock = appData.mockExams.find(m => m.id === mockId);
            if (!mock) return;

            const qId = 'q_' + Date.now();
            const newQ = {
                subject: document.getElementById(`mq-subject-${mockId}`).value.trim(),
                topic: document.getElementById(`mq-topic-${mockId}`).value.trim(),
                question: document.getElementById(`mq-text-${mockId}`).value.trim(),
                options: [
                    document.getElementById(`mq-opt-0-${mockId}`).value.trim(),
                    document.getElementById(`mq-opt-1-${mockId}`).value.trim(),
                    document.getElementById(`mq-opt-2-${mockId}`).value.trim(),
                    document.getElementById(`mq-opt-3-${mockId}`).value.trim()
                ],
                correctAnswer: parseInt(document.getElementById(`mq-correct-${mockId}`).value),
                explanation: document.getElementById(`mq-explain-${mockId}`).value.trim()
            };

            window.saveFirestoreDoc('questions', qId, newQ);
            if (!mock.questions) mock.questions = [];
            mock.questions.push(qId);
            window.saveFirestoreDoc('mockExams', mock.id, mock);

            window.showToast(`Question added to ${mock.title}!`, 'success');
            renderAdminMocksTab(document.getElementById('admin-tab-content'));
        };

        window.handleMockUploadJSON = function(e, mockId) {
            e.preventDefault();
            const mock = appData.mockExams.find(m => m.id === mockId);
            if (!mock) return;

            try {
                const parsed = JSON.parse(document.getElementById(`mq-json-input-${mockId}`).value);
                if (!Array.isArray(parsed)) return window.showToast('JSON must be an array of questions', 'error');

                let count = 0;
                if (!mock.questions) mock.questions = [];
                parsed.forEach(q => {
                    if (q.question && Array.isArray(q.options)) {
                        const qId = 'q_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                        const newQ = {
                            subject: q.subject || mock.subject,
                            topic: q.topic || 'General',
                            question: q.question,
                            options: q.options,
                            correctAnswer: typeof q.correctAnswer === 'number' ? q.correctAnswer : 0,
                            explanation: q.explanation || ''
                        };
                        window.saveFirestoreDoc('questions', qId, newQ);
                        mock.questions.push(qId);
                        count++;
                    }
                });

                window.saveFirestoreDoc('mockExams', mock.id, mock);
                window.showToast(`Added ${count} questions to ${mock.title}!`, 'success');
                renderAdminMocksTab(document.getElementById('admin-tab-content'));
            } catch(err) {
                window.showToast('Invalid JSON syntax', 'error');
            }
        };

        window.toggleScoreRelease = function(mockId) {
            const mock = appData.mockExams.find(m => m.id === mockId);
            if (mock) {
                mock.resultsReleased = !mock.resultsReleased;
                window.saveFirestoreDoc('mockExams', mock.id, mock);
                window.showToast(`Scores ${mock.resultsReleased ? 'Released' : 'Locked'}`, 'info');
                renderAdminMocksTab(document.getElementById('admin-tab-content'));
            }
        };

        window.deleteMockExam = function(mockId) {
            if (confirm("Delete this mock exam?")) {
                window.deleteFirestoreDoc('mockExams', mockId);
                renderAdminMocksTab(document.getElementById('admin-tab-content'));
            }
        };

                                <input type="text" id="f-topic" placeholder="Topic Tag" required class="w-full p-2.5 rounded-lg border border-slate-300 text-xs bg-slate-50">
                                <input type="text" id="f-concept" placeholder="Front Card Concept / Title" required class="w-full p-2.5 rounded-lg border border-slate-300 text-xs font-bold text-navy-800 bg-slate-50">
                                <textarea id="f-explanation" rows="4" placeholder="Back Card Formula / Full Explanation" required class="w-full p-2.5 rounded-lg border border-slate-300 text-xs bg-slate-50"></textarea>
                                <button type="submit" class="w-full bg-amber-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs">Add Single Flashcard</button>
                            </form>

                            <form id="form-f-json" onsubmit="window.handleUploadFlashcardJSON(event)" class="space-y-3 hidden">
                                <textarea id="f-json-input" rows="8" placeholder='[\n  {\n    "subject": "Chemistry",\n    "topic": "Stoichiometry",\n    "concept": "Avogadro Constant",\n    "explanation": "6.022 x 10^23 particles per mole of substance."\n  }\n]' class="w-full p-2.5 rounded-lg border border-slate-300 text-xs font-mono bg-slate-900 text-amber-300 focus:outline-none"></textarea>
                                <button type="submit" class="w-full bg-amber-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs">Upload JSON Bulk Flashcards</button>
                            </form>
                        </div>
                    </div>

                    <div class="grid md:grid-cols-2 gap-6">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                            <h3 class="text-xs font-extrabold text-navy-800">Manage Uploaded Questions (${appData.questions.length})</h3>
                            <div class="max-h-96 overflow-y-auto space-y-2 pr-1">
                                ${appData.questions.length === 0 ? `<div class="text-xs text-slate-400 text-center py-6">No questions added yet.</div>` : appData.questions.map((q, idx) => `
                                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 flex justify-between items-start gap-2 text-xs">
                                        <div>
                                            <span class="font-bold text-navy-800">[${q.subject}]</span> <span class="text-slate-600">${q.question}</span>
                                        </div>
                                        <div class="flex gap-2 shrink-0">
                                            <button onclick="window.openEditQuestionModal('${q.id}')" class="text-amber-600 font-bold"><i class="fas fa-edit"></i></button>
                                            <button onclick="window.deleteQuestion('${q.id}')" class="text-red-600 font-bold"><i class="fas fa-trash"></i></button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>

                        <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                            <h3 class="text-xs font-extrabold text-navy-800">Manage Uploaded Flashcards (${appData.flashcards.length})</h3>
                            <div class="max-h-96 overflow-y-auto space-y-2 pr-1">
                                ${appData.flashcards.length === 0 ? `<div class="text-xs text-slate-400 text-center py-6">No flashcards added yet.</div>` : appData.flashcards.map((f, idx) => `
                                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 flex justify-between items-start gap-2 text-xs">
                                        <div>
                                            <span class="font-bold text-navy-800">[${f.subject}]</span> <span class="font-semibold">${f.concept}</span>
                                        </div>
                                        <div class="flex gap-2 shrink-0">
                                            <button onclick="window.openEditFlashcardModal('${f.id}')" class="text-amber-600 font-bold"><i class="fas fa-edit"></i></button>
                                            <button onclick="window.deleteFlashcard('${f.id}')" class="text-red-600 font-bold"><i class="fas fa-trash"></i></button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        window.toggleUploadMode = function(type, mode) {
            const singleForm = document.getElementById(`form-${type}-single`);
            const jsonForm = document.getElementById(`form-${type}-json`);
            const singleBtn = document.getElementById(`${type}-btn-single`);
            const jsonBtn = document.getElementById(`${type}-btn-json`);

            if (mode === 'single') {
                singleForm.classList.remove('hidden');
                jsonForm.classList.add('hidden');
                singleBtn.className = "px-2.5 py-1 rounded text-[10px] font-bold bg-navy-800 text-amber-400";
                jsonBtn.className = "px-2.5 py-1 rounded text-[10px] font-bold bg-slate-100 text-slate-600";
            } else {
                jsonForm.classList.remove('hidden');
                singleForm.classList.add('hidden');
                jsonBtn.className = "px-2.5 py-1 rounded text-[10px] font-bold bg-navy-800 text-amber-400";
                singleBtn.className = "px-2.5 py-1 rounded text-[10px] font-bold bg-slate-100 text-slate-600";
            }
        };

        window.handleUploadQuestionSingle = function(e) {
            e.preventDefault();
            const qId = 'q_' + Date.now();
            const newQ = {
                subject: document.getElementById('q-subject').value.trim(),
                topic: document.getElementById('q-topic').value.trim(),
                question: document.getElementById('q-text').value.trim(),
                options: [
                    document.getElementById('q-opt-0').value.trim(),
                    document.getElementById('q-opt-1').value.trim(),
                    document.getElementById('q-opt-2').value.trim(),
                    document.getElementById('q-opt-3').value.trim()
                ],
                correctAnswer: parseInt(document.getElementById('q-correct').value),
                explanation: document.getElementById('q-explain').value.trim()
            };
            window.saveFirestoreDoc('questions', qId, newQ);
            window.showToast('Question added to bank!', 'success');
            renderAdminUploadTab(document.getElementById('admin-tab-content'));
        };

        window.handleUploadQuestionJSON = function(e) {
            e.preventDefault();
            try {
                const parsed = JSON.parse(document.getElementById('q-json-input').value);
                if (!Array.isArray(parsed)) return window.showToast('JSON must be an array of questions', 'error');

                let count = 0;
                parsed.forEach(q => {
                    if (q.subject && q.question && Array.isArray(q.options)) {
                        const qId = 'q_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                        const newQ = {
                            subject: q.subject,
                            topic: q.topic || 'General',
                            question: q.question,
                            options: q.options,
                            correctAnswer: typeof q.correctAnswer === 'number' ? q.correctAnswer : 0,
                            explanation: q.explanation || ''
                        };
                        window.saveFirestoreDoc('questions', qId, newQ);
                        count++;
                    }
                });

                window.showToast(`Successfully imported ${count} questions in bulk!`, 'success');
                renderAdminUploadTab(document.getElementById('admin-tab-content'));
            } catch(err) {
                window.showToast('Invalid JSON format syntax', 'error');
            }
        };

        window.deleteQuestion = function(qId) {
            if (confirm("Delete this question from vault?")) {
                window.deleteFirestoreDoc('questions', qId);
                appData.mockExams.forEach(m => {
                    if (m.questions && m.questions.includes(qId)) {
                        m.questions = m.questions.filter(id => id !== qId);
                        window.saveFirestoreDoc('mockExams', m.id, m);
                    }
                });
                renderAdminUploadTab(document.getElementById('admin-tab-content'));
                window.showToast('Question deleted', 'info');
            }
        };

        window.openEditQuestionModal = function(qId) {
            const q = appData.questions.find(item => item.id === qId);
            if (!q) return;

            const modal = document.getElementById('modal-container');
            const box = document.getElementById('modal-content-box');
            modal.classList.remove('hidden');

            box.innerHTML = `
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h3 class="text-sm font-bold text-navy-800">Edit Question</h3>
                    <button onclick="window.closeModal()" class="text-slate-400 hover:text-slate-700"><i class="fas fa-times"></i></button>
                </div>
                <form onsubmit="window.handleSaveEditQuestion(event, '${qId}')" class="space-y-3">
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="edit-q-subject" value="${q.subject}" required class="w-full p-2 rounded-lg border border-slate-300 text-xs bg-slate-50">
                        <input type="text" id="edit-q-topic" value="${q.topic}" required class="w-full p-2 rounded-lg border border-slate-300 text-xs bg-slate-50">
                    </div>
                    <textarea id="edit-q-text" rows="2" required class="w-full p-2 rounded-lg border border-slate-300 text-xs bg-slate-50">${q.question}</textarea>
                    <div class="grid grid-cols-2 gap-2">
                        <input type="text" id="edit-q-opt-0" value="${q.options[0] || ''}" required class="w-full p-2 rounded-lg border border-slate-300 text-xs bg-slate-50">
                        <input type="text" id="edit-q-opt-1" value="${q.options[1] || ''}" required class="w-full p-2 rounded-lg border border-slate-300 text-xs bg-slate-50">
                        <input type="text" id="edit-q-opt-2" value="${q.options[2] || ''}" required class="w-full p-2 rounded-lg border border-slate-300 text-xs bg-slate-50">
                        <input type="text" id="edit-q-opt-3" value="${q.options[3] || ''}" required class="w-full p-2 rounded-lg border border-slate-300 text-xs bg-slate-50">
                    </div>
                    <select id="edit-q-correct" class="w-full p-2 rounded-lg border border-slate-300 text-xs font-bold bg-slate-50">
                        <option value="0" ${q.correctAnswer === 0 ? 'selected' : ''}>Option A is Correct</option>
                        <option value="1" ${q.correctAnswer === 1 ? 'selected' : ''}>Option B is Correct</option>
                        <option value="2" ${q.correctAnswer === 2 ? 'selected' : ''}>Option C is Correct</option>
                        <option value="3" ${q.correctAnswer === 3 ? 'selected' : ''}>Option D is Correct</option>
                    </select>
                    <textarea id="edit-q-explain" rows="2" class="w-full p-2 rounded-lg border border-slate-300 text-xs bg-slate-50">${q.explanation || ''}</textarea>
                    <button type="submit" class="w-full bg-navy-800 text-amber-400 font-bold py-2.5 rounded-xl text-xs">Update Question</button>
                </form>
            `;
        };

        window.handleSaveEditQuestion = function(e, qId) {
            e.preventDefault();
            const subject = document.getElementById('edit-q-subject').value.trim();
            const topic = document.getElementById('edit-q-topic').value.trim();
            const question = document.getElementById('edit-q-text').value.trim();
            const options = [
                document.getElementById('edit-q-opt-0').value.trim(),
                document.getElementById('edit-q-opt-1').value.trim(),
                document.getElementById('edit-q-opt-2').value.trim(),
                document.getElementById('edit-q-opt-3').value.trim()
            ];
            const correctAnswer = parseInt(document.getElementById('edit-q-correct').value);
            const explanation = document.getElementById('edit-q-explain').value.trim();

            window.saveFirestoreDoc('questions', qId, { subject, topic, question, options, correctAnswer, explanation });
            window.closeModal();
            window.showToast('Question updated successfully', 'success');
            if (appState.activeTab === 'mocks') {
                renderAdminMocksTab(document.getElementById('admin-tab-content'));
            } else {
                renderAdminUploadTab(document.getElementById('admin-tab-content'));
            }
        };

        window.handleUploadFlashcardSingle = function(e) {
            e.preventDefault();
            const fId = 'f_' + Date.now();
            const newF = {
                subject: document.getElementById('f-subject').value.trim(),
                topic: document.getElementById('f-topic').value.trim(),
                concept: document.getElementById('f-concept').value.trim(),
                explanation: document.getElementById('f-explanation').value.trim()
            };
            window.saveFirestoreDoc('flashcards', fId, newF);
            window.showToast('Flashcard created!', 'success');
            renderAdminUploadTab(document.getElementById('admin-tab-content'));
        };

        window.handleUploadFlashcardJSON = function(e) {
            e.preventDefault();
            try {
                const parsed = JSON.parse(document.getElementById('f-json-input').value);
                if (!Array.isArray(parsed)) return window.showToast('JSON must be an array', 'error');

                let count = 0;
                parsed.forEach(f => {
                    if (f.subject && f.concept && f.explanation) {
                        const fId = 'f_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
                        const newF = {
                            subject: f.subject,
                            topic: f.topic || 'General',
                            concept: f.concept,
                            explanation: f.explanation
                        };
                        window.saveFirestoreDoc('flashcards', fId, newF);
                        count++;
                    }
                });

                window.showToast(`Successfully imported ${count} flashcards in bulk!`, 'success');
                renderAdminUploadTab(document.getElementById('admin-tab-content'));
            } catch(err) {
                window.showToast('Invalid JSON syntax', 'error');
            }
        };

        window.deleteFlashcard = function(fId) {
            if (confirm("Delete this flashcard?")) {
                window.deleteFirestoreDoc('flashcards', fId);
                renderAdminUploadTab(document.getElementById('admin-tab-content'));
                window.showToast('Flashcard deleted', 'info');
            }
        };

        window.openEditFlashcardModal = function(fId) {
            const f = appData.flashcards.find(item => item.id === fId);
            if (!f) return;

            const modal = document.getElementById('modal-container');
            const box = document.getElementById('modal-content-box');
            modal.classList.remove('hidden');

            box.innerHTML = `
                <div class="flex justify-between items-center mb-4 border-b pb-2">
                    <h3 class="text-sm font-bold text-navy-800">Edit Flashcard</h3>
                    <button onclick="window.closeModal()" class="text-slate-400 hover:text-slate-700"><i class="fas fa-times"></i></button>
                </div>
                <form onsubmit="window.handleSaveEditFlashcard(event, '${fId}')" class="space-y-3">
                    <input type="text" id="edit-f-subject" value="${f.subject}" required class="w-full p-2.5 rounded-lg border border-slate-300 text-xs bg-slate-50">
                    <input type="text" id="edit-f-topic" value="${f.topic}" required class="w-full p-2.5 rounded-lg border border-slate-300 text-xs bg-slate-50">
                    <input type="text" id="edit-f-concept" value="${f.concept}" required class="w-full p-2.5 rounded-lg border border-slate-300 text-xs font-bold text-navy-800 bg-slate-50">
                    <textarea id="edit-f-explanation" rows="4" required class="w-full p-2.5 rounded-lg border border-slate-300 text-xs bg-slate-50">${f.explanation}</textarea>
                    <button type="submit" class="w-full bg-amber-500 text-slate-950 font-bold py-2.5 rounded-xl text-xs">Update Flashcard</button>
                </form>
            `;
        };

        window.handleSaveEditFlashcard = function(e, fId) {
            e.preventDefault();
            const subject = document.getElementById('edit-f-subject').value.trim();
            const topic = document.getElementById('edit-f-topic').value.trim();
            const concept = document.getElementById('edit-f-concept').value.trim();
            const explanation = document.getElementById('edit-f-explanation').value.trim();

            window.saveFirestoreDoc('flashcards', fId, { subject, topic, concept, explanation });
            window.closeModal();
            window.showToast('Flashcard updated successfully', 'success');
            renderAdminUploadTab(document.getElementById('admin-tab-content'));
        };

        window.closeModal = function() {
            document.getElementById('modal-container').classList.add('hidden');
        };

        // Initialize application on page load
        window.addEventListener('DOMContentLoaded', () => {
            window.renderApp();
        });
    </script>
</body>
</html>
